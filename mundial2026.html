<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 — Cuenta Regresiva</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    padding: 2rem;
  }

  .container {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C8A951;
    border: 1px solid #C8A951;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1.5rem;
  }

  .titulo {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .subtitulo {
    font-size: 15px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 2.5rem;
    letter-spacing: 0.02em;
  }

  .banderas {
    font-size: 28px;
    margin-bottom: 2.5rem;
    letter-spacing: 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 2rem;
  }

  .bloque {
    background: #161616;
    border: 0.5px solid #2a2a2a;
    border-radius: 12px;
    padding: 1.25rem 0.5rem 1rem;
    position: relative;
    overflow: hidden;
  }

  .bloque::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: #C8A951;
    opacity: 0.6;
  }

  .num {
    font-size: clamp(32px, 9vw, 48px);
    font-weight: 700;
    color: #fff;
    line-height: 1;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .lbl {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  .mensaje {
    font-size: 16px;
    color: #C8A951;
    font-weight: 500;
    margin-bottom: 0.4rem;
  }

  .fecha-txt {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
  }

  .balon {
    font-size: 40px;
    display: block;
    margin-bottom: 1.25rem;
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @media (max-width: 360px) {
    .grid { gap: 6px; }
    .bloque { padding: 1rem 0.25rem 0.75rem; }
  }
</style>
</head>
<body>

<div class="container">
  <span class="balon">⚽</span>
  <div class="badge">FIFA World Cup 2026</div>
  <h1 class="titulo">Inauguración<br>Mundial 2026</h1>
  <p class="subtitulo">Jueves 11 de junio · 11:00 AM · Ciudad de México</p>
  <div class="banderas">🇲🇽 🇺🇸 🇨🇦</div>

  <div class="grid">
    <div class="bloque">
      <div class="num" id="dias">--</div>
      <div class="lbl">Días</div>
    </div>
    <div class="bloque">
      <div class="num" id="horas">--</div>
      <div class="lbl">Horas</div>
    </div>
    <div class="bloque">
      <div class="num" id="mins">--</div>
      <div class="lbl">Minutos</div>
    </div>
    <div class="bloque">
      <div class="num" id="segs">--</div>
      <div class="lbl">Segundos</div>
    </div>
  </div>

  <p class="mensaje" id="mensaje">¡Faltan pocos días para el Mundial!</p>
  <p class="fecha-txt">11 · 06 · 2026</p>
</div>

<script>
  const target = new Date('2026-06-11T11:00:00-06:00').getTime();

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const diff = target - Date.now();

    if (diff <= 0) {
      ['dias','horas','mins','segs'].forEach(id => document.getElementById(id).textContent = '00');
      document.getElementById('mensaje').textContent = '¡Arrancó el Mundial! 🎉';
      return;
    }

    document.getElementById('dias').textContent  = pad(Math.floor(diff / 86400000));
    document.getElementById('horas').textContent = pad(Math.floor((diff % 86400000) / 3600000));
    document.getElementById('mins').textContent  = pad(Math.floor((diff % 3600000) / 60000));
    document.getElementById('segs').textContent  = pad(Math.floor((diff % 60000) / 1000));

    const d = Math.floor(diff / 86400000);
    const msg = document.getElementById('mensaje');
    if (d === 0)      msg.textContent = '¡Hoy es el día! 🔥';
    else if (d === 1) msg.textContent = '¡Mañana arranca el Mundial! 🔥';
    else              msg.textContent = '¡Faltan ' + d + ' días para el Mundial!';
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
