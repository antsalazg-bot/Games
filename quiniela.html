<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;font-family:'Helvetica Neue',Arial,sans-serif;color:#fff;min-height:100vh}
.hero{text-align:center;padding:2rem 1rem 1.5rem}
.hero-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C8A951;border:1px solid #C8A951;padding:4px 14px;border-radius:20px;margin-bottom:1rem}
.hero-title{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:.3rem}
.hero-sub{font-size:13px;color:rgba(255,255,255,.4)}

/* LOGIN */
.login-wrap{max-width:360px;margin:0 auto;padding:0 1rem 2rem}
.login-card{background:#161616;border:.5px solid #2a2a2a;border-radius:12px;padding:1.5rem}
.login-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#C8A951;margin-bottom:1rem}
.login-input{width:100%;background:#0a0a0a;border:.5px solid #333;border-radius:8px;padding:10px 14px;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.login-input:focus{border-color:#C8A951}
.login-btn{width:100%;background:#C8A951;color:#0a0a0a;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.login-btn:active{opacity:.85}
.familias-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fam-chip{background:#1e1e1e;border:.5px solid #333;border-radius:20px;padding:6px 14px;font-size:13px;color:rgba(255,255,255,.7);cursor:pointer;transition:.15s}
.fam-chip:hover,.fam-chip.active{background:#C8A951;color:#0a0a0a;border-color:#C8A951;font-weight:700}

/* NAV */
.nav{display:flex;gap:0;border-bottom:.5px solid #2a2a2a;margin-bottom:0;max-width:480px;margin:0 auto}
.nav-btn{flex:1;padding:12px 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.35);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.nav-btn.active{color:#C8A951;border-bottom-color:#C8A951}

.main{max-width:480px;margin:0 auto;padding:1rem 1rem 3rem}

/* PARTIDO CARD */
.fase-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#C8A951;margin:1.25rem 0 .6rem;padding-left:2px;border-left:3px solid #C8A951;padding-left:6px}
.partido-card{background:#161616;border:.5px solid #2a2a2a;border-radius:10px;padding:.85rem 1rem;margin-bottom:8px}
.partido-card.mx{border-color:rgba(200,169,81,.4);background:rgba(200,169,81,.05)}
.p-meta{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.3);margin-bottom:.5rem;letter-spacing:.04em}
.p-teams{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.p-team{flex:1;font-size:13px;font-weight:500;color:#fff}
.p-team.right{text-align:right}
.p-vs{font-size:11px;color:rgba(255,255,255,.3);flex-shrink:0}
.p-inputs{display:flex;align-items:center;gap:6px}
.score-input{width:44px;background:#0a0a0a;border:.5px solid #333;border-radius:6px;padding:7px 4px;color:#fff;font-size:18px;font-weight:700;text-align:center;outline:none}
.score-input:focus{border-color:#C8A951}
.score-input:disabled{opacity:.5;cursor:not-allowed}
.score-sep{font-size:16px;color:rgba(255,255,255,.3)}
.p-result{display:flex;align-items:center;gap:6px;margin-top:.5rem}
.result-label{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.06em}
.result-score{font-size:13px;font-weight:700;color:#4ade80}
.pts-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pts-3{background:rgba(74,222,128,.15);color:#4ade80}
.pts-1{background:rgba(200,169,81,.15);color:#C8A951}
.pts-0{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3)}
.save-btn{width:100%;background:#C8A951;color:#0a0a0a;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;margin-top:1rem}
.save-btn:active{opacity:.85}
.save-status{text-align:center;font-size:12px;color:#4ade80;margin-top:.5rem;min-height:18px}

/* TABLA */
.tabla-card{background:#161616;border:.5px solid #2a2a2a;border-radius:10px;overflow:hidden;margin-top:.5rem}
.tabla-row{display:flex;align-items:center;padding:.85rem 1rem;border-bottom:.5px solid #1e1e1e;gap:10px}
.tabla-row:last-child{border-bottom:none}
.tabla-row.header{background:#111;padding:.5rem 1rem}
.pos{font-size:12px;color:rgba(255,255,255,.3);min-width:20px;text-align:center}
.pos.gold{color:#C8A951;font-weight:700;font-size:14px}
.fam-name{flex:1;font-size:14px;font-weight:500}
.fam-pts{font-size:18px;font-weight:700;color:#C8A951;min-width:40px;text-align:right}
.fam-detail{font-size:11px;color:rgba(255,255,255,.3)}

/* RESULTADO (admin) */
.admin-note{background:rgba(200,169,81,.08);border:.5px solid rgba(200,169,81,.2);border-radius:8px;padding:.75rem 1rem;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:1rem;line-height:1.5}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#4ade80;color:#0a0a0a;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>

    <button class="nav-btn active" onclick="showTab('picks')">Mis pronósticos</button>

// Campeon prediction
const CAMPEON_OPCIONES = ['México','Brasil','Argentina','Francia','Alemania','España','Portugal','Inglaterra','Países Bajos','USA','Marruecos','Japón','Colombia','Uruguay','Bélgica','Corea del Sur'];

let familia = localStorage.getItem('quiniela_familia') || '';
let allData = { familias: {}, resultados: {} };
let picks = {};

// ── Init ─────────────────────────────────────────────────────
window.onload = async () => {
  renderFamiliasList();
  if (familia) iniciarApp();
  else document.getElementById('loginSection').style.display = 'block';
};

function renderFamiliasList() {
  const known = JSON.parse(localStorage.getItem('quiniela_known') || '[]');
  const el = document.getElementById('familiasList');
  el.innerHTML = known.map(f => `<span class="fam-chip" onclick="selectFam('${f}')">${f}</span>`).join('');
}

function selectFam(f) {
  document.getElementById('familiaInput').value = f;
  document.querySelectorAll('.fam-chip').forEach(c => c.classList.toggle('active', c.textContent === f));
}

function entrar() {
  const val = document.getElementById('familiaInput').value.trim();
  if (!val) return;
  familia = val;
  localStorage.setItem('quiniela_familia', val);
  const known = JSON.parse(localStorage.getItem('quiniela_known') || '[]');
  if (!known.includes(val)) { known.push(val); localStorage.setItem('quiniela_known', JSON.stringify(known)); }
  document.getElementById('loginSection').style.display = 'none';
  iniciarApp();
}

function salir() {
  familia = '';
  localStorage.removeItem('quiniela_familia');
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'block';
  renderFamiliasList();
}

async function iniciarApp() {
  document.getElementById('appSection').style.display = 'block';
  document.getElementById('familiaLabel').textContent = '🏠 ' + familia;
  await cargarDatos();
  renderPicks();
  renderTabla();
  renderResultados();
}

async function cargarDatos() {
  try {
    const r = await fetch(API + '?action=getAll');
    allData = await r.json();
    if (allData.familias && allData.familias[familia]) {
      picks = allData.familias[familia].picks || {};
    }
  } catch(e) { console.log('Sin conexión', e); }
}

// ── TABS ─────────────────────────────────────────────────────
function showTab(tab) {
  ['picks','tabla','resultados'].forEach(t => {
    document.getElementById(t+'Tab').style.display = t === tab ? 'block' : 'none';
    document.querySelectorAll('.nav-btn').forEach((b,i) => {
      b.classList.toggle('active', ['picks','tabla','resultados'][i] === tab);
    });
  });
  if (tab === 'tabla') { cargarDatos().then(renderTabla); }
}

// ── PICKS ─────────────────────────────────────────────────────
function renderPicks() {
  const grupos = ['A','B','C','D','E','F','G','H','I','J','K','L','16avos','Cuartos','Semis','Final'];
  let html = '';
  grupos.forEach(g => {
    const ps = PARTIDOS.filter(p => p.g === g);
    if (!ps.length) return;
    const label = g.length === 1 ? 'Grupo ' + g : g === '16avos' ? 'Dieciseisavos' : g === 'Cuartos' ? 'Cuartos de Final' : g === 'Semis' ? 'Semifinales' : 'Final';
    html += `<div class="fase-label">${label}</div>`;
    ps.forEach(p => {
      const pred = picks[p.id] || {};
      const res = allData.resultados[p.id];
      const pts = calcPts(pred, res);
      const ptsHtml = res ? `<span class="pts-badge pts-${pts}">${pts === 3 ? '3 pts ✓' : pts === 1 ? '1 pt ~' : '0 pts ✗'}</span>` : '';
      html += `
      <div class="partido-card${p.mx ? ' mx' : ''}">
        <div class="p-meta"><span>Grupo ${p.g} · ${p.fecha}</span><span>${p.sede}</span></div>
        <div class="p-teams">
          <span class="p-team">${p.mx && p.local === 'México' ? '🇲🇽 ' : ''}${p.local}</span>
          <span class="p-vs">vs</span>
          <span class="p-team right">${p.mx && p.visit === 'México' ? '🇲🇽 ' : ''}${p.visit}</span>
        </div>
        <div class="p-inputs">
          <input type="number" class="score-input" id="l_${p.id}" min="0" max="20" value="${pred.predLocal ?? ''}" placeholder="0" ${res ? 'disabled' : ''}>
          <span class="score-sep">—</span>
          <input type="number" class="score-input" id="v_${p.id}" min="0" max="20" value="${pred.predVisitante ?? ''}" placeholder="0" ${res ? 'disabled' : ''}>
          ${ptsHtml}
        </div>
        ${res ? `<div class="p-result"><span class="result-label">Resultado:</span><span class="result-score">${res.local} - ${res.visitante}</span></div>` : ''}
      </div>`;
    });
  });

  // Campeón
  const predCampeon = localStorage.getItem('pred_campeon_' + familia) || '';
  html += `<div class="fase-label">Campeón del Mundial</div>
  <div class="partido-card">
    <p style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:.75rem">¿Quién va a ganar el Mundial 2026?</p>
    <select id="sel_campeon" style="width:100%;background:#0a0a0a;border:.5px solid #333;border-radius:8px;padding:10px;color:#fff;font-size:14px;outline:none">
      <option value="">Elige un equipo...</option>
      ${CAMPEON_OPCIONES.map(c => `<option value="${c}" ${predCampeon === c ? 'selected' : ''}>${c}</option>`).join('')}
    </select>
  </div>`;

  document.getElementById('picksContent').innerHTML = html;
}

function calcPts(pred, res) {
  if (!res || pred.predLocal === '' || pred.predLocal === undefined) return null;
  const pL = Number(pred.predLocal), pV = Number(pred.predVisitante);
  const rL = Number(res.local), rV = Number(res.visitante);
  if (pL === rL && pV === rV) return 3;
  if ((pL > pV && rL > rV) || (pL < pV && rL < rV) || (pL === pV && rL === rV)) return 1;
  return 0;
}

async function guardarTodo() {
  const btn = document.querySelector('.save-btn');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  const promises = PARTIDOS.map(p => {
    const lEl = document.getElementById('l_' + p.id);
    const vEl = document.getElementById('v_' + p.id);
    if (!lEl || lEl.disabled) return null;
    const l = lEl.value, v = vEl.value;
    if (l === '' && v === '') return null;
    return fetch(API + '?action=x', {
      method: 'POST',
      body: JSON.stringify({ action: 'savePick', familia, partidoId: p.id, local: l, visitante: v })
    }).catch(() => null);
  }).filter(Boolean);

  // Campeón
  const sel = document.getElementById('sel_campeon');
  if (sel && sel.value) localStorage.setItem('pred_campeon_' + familia, sel.value);

  await Promise.all(promises);
  await cargarDatos();
  renderPicks();

  btn.textContent = 'Guardar pronósticos';
  btn.disabled = false;
  showToast('¡Pronósticos guardados!');
}

// ── TABLA ─────────────────────────────────────────────────────
function renderTabla() {
  const fams = Object.entries(allData.familias || {})
    .map(([nombre, data]) => ({ nombre, puntos: data.puntos || 0 }))
    .sort((a, b) => b.puntos - a.puntos);

  if (!fams.length) {
    document.getElementById('tablaContent').innerHTML = '<p style="text-align:center;color:rgba(255,255,255,.3);padding:2rem">Aún no hay pronósticos registrados</p>';
    return;
  }

  let html = '<div class="tabla-card">';
  fams.forEach((f, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    const isMine = f.nombre === familia;
    html += `<div class="tabla-row" style="${isMine ? 'background:rgba(200,169,81,.08)' : ''}">
      <span class="pos ${i === 0 ? 'gold' : ''}">${medal || (i + 1)}</span>
      <span class="fam-name">${f.nombre}${isMine ? ' <span style="font-size:10px;color:#C8A951">(tú)</span>' : ''}</span>
      <span class="fam-pts">${f.puntos}</span>
      <span class="fam-detail">pts</span>
    </div>`;
  });
  html += '</div>';
  document.getElementById('tablaContent').innerHTML = html;
}

// ── RESULTADOS ─────────────────────────────────────────────────
function renderResultados() {
  const grupos = ['A','B','C','D','E','F','G','H','I','J','K','L','16avos','Cuartos','Semis','Final'];
  let html = '';
  grupos.forEach(g => {
    const ps = PARTIDOS.filter(p => p.g === g);
    if (!ps.length) return;
    const label = g.length === 1 ? 'Grupo ' + g : g;
    html += `<div class="fase-label">${label}</div>`;
    ps.forEach(p => {
      const res = allData.resultados[p.id] || {};
      html += `
      <div class="partido-card${p.mx ? ' mx' : ''}">
        <div class="p-meta"><span>${p.fecha}</span></div>
        <div class="p-teams">
          <span class="p-team">${p.local}</span>
          <span class="p-vs">vs</span>
          <span class="p-team right">${p.visit}</span>
        </div>
        <div class="p-inputs">
          <input type="number" class="score-input" id="rl_${p.id}" min="0" max="20" value="${res.local ?? ''}" placeholder="0">
          <span class="score-sep">—</span>
          <input type="number" class="score-input" id="rv_${p.id}" min="0" max="20" value="${res.visitante ?? ''}" placeholder="0">
          <button onclick="saveResult('${p.id}')" style="margin-left:6px;background:#333;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer">Guardar</button>
        </div>
      </div>`;
    });
  });
  document.getElementById('resultadosContent').innerHTML = html;
}

async function saveResult(id) {
  const l = document.getElementById('rl_' + id).value;
  const v = document.getElementById('rv_' + id).value;
  if (l === '' || v === '') return;
  await fetch(API + '?action=x', {
    method: 'POST',
    body: JSON.stringify({ action: 'saveResult', partidoId: id, local: l, visitante: v })
  }).catch(() => null);
  await cargarDatos();
  renderPicks();
  renderTabla();
  renderResultados();
  showToast('Resultado guardado');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
