// ── HELPERS ──────────────────────────────────────────────────
function hashPass(p){ let h=0; for(let c of p){h=(h<<5)-h+c.charCodeAt(0);h|=0;} return String(h); }
function storeKey(f){ return 'qm_pass_'+f.toLowerCase().replace(/\s+/g,'_'); }
function getStoredHash(f){ return localStorage.getItem(storeKey(f)); }
function setStoredHash(f,p){ localStorage.setItem(storeKey(f), hashPass(p)); }
function verifyPass(f,p){ const stored=getStoredHash(f); if(!stored){ setStoredHash(f,p); return true; } return stored===hashPass(p); }
function isNew(f){ return !getStoredHash(f); }

// ── INIT ─────────────────────────────────────────────────────
window.onload=async()=>{
  renderChips();
  const saved=localStorage.getItem('qm_familia');
  if(saved){ document.getElementById('famInput').value=saved; }
};

function renderChips(){
  const known=JSON.parse(localStorage.getItem('qm_known')||'[]');
  const el=document.getElementById('famChips');
  el.innerHTML=known.map(f=>`<span class="chip" onclick="selectFam('${f}')">${f}</span>`).join('');
}

function selectFam(f){
  document.getElementById('famInput').value=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.textContent===f));
}

async function entrar(){
  const f=document.getElementById('famInput').value.trim();
  const p=document.getElementById('passInput').value.trim();
  const err=document.getElementById('loginError');
  if(!f){err.textContent='Escribe el nombre de tu familia';return;}
  if(!p){err.textContent='Escribe una contraseña';return;}

  if(isNew(f)){
    // First time — create password
    if(p.length<3){err.textContent='La contraseña debe tener al menos 3 caracteres';return;}
    setStoredHash(f,p);
    const known=JSON.parse(localStorage.getItem('qm_known')||'[]');
    if(!known.includes(f)){known.push(f);localStorage.setItem('qm_known',JSON.stringify(known));}
    err.style.color='#4ade80';err.textContent='✓ Familia registrada — bienvenidos!';
  } else {
    if(!verifyPass(f,p)){err.style.color='#f87171';err.textContent='Contraseña incorrecta';return;}
    err.style.color='#4ade80';err.textContent='';
  }

  familia=f;
  localStorage.setItem('qm_familia',f);
  document.getElementById('loginSection').style.display='none';
  await iniciarApp();
}

function salir(){
  familia='';
  localStorage.removeItem('qm_familia');
  document.getElementById('appSection').style.display='none';
  document.getElementById('loginSection').style.display='block';
  document.getElementById('passInput').value='';
  document.getElementById('loginError').textContent='';
  document.getElementById('loginError').style.color='#f87171';
  renderChips();
}

async function iniciarApp(){
  document.getElementById('appSection').style.display='block';
  document.getElementById('famLabel').textContent='🏠 '+familia;

  renderTabla();
  renderResultados();
  // Then load data in background and re-render
  cargarDatos().then(()=>{
    renderPicks();
    renderTabla();
    renderResultados();
  });
}

async function cargarDatos(){
  try{
    const url=API+'?action=getAll&t='+Date.now();
    const r=await fetch(url, {redirect:'follow'});
    const d=await r.json();
    allData=d||{familias:{},resultados:{}};
    if(d.familias&&d.familias[familia]){picks=d.familias[familia].picks||{};}
  }catch(e){
    console.log('API error',e);
    allData={familias:{},resultados:{}};
  }
}

// ── TABS ─────────────────────────────────────────────────────
function showTab(tab){
  ['picks','tabla','resultados'].forEach(t=>{
    document.getElementById(t+'Tab').style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['picks','tabla','resultados'][i]===tab));
  if(tab==='tabla') cargarDatos().then(renderTabla);
}

// ── PICKS ─────────────────────────────────────────────────────
function calcPts(pred,res){
  if(!res||pred.predLocal===''||pred.predLocal===undefined) return null;
  const pL=Number(pred.predLocal),pV=Number(pred.predVisitante);
  const rL=Number(res.local),rV=Number(res.visitante);
  if(pL===rL&&pV===rV) return 3;
  if((pL>pV&&rL>rV)||(pL<pV&&rL<rV)||(pL===pV&&rL===rV)) return 1;
  return 0;
}

function renderPicks(){
  const GRUPOS=['A','B','C','D','E','F','G','H','I','J','K','L','16avos','Cuartos','Semis','Tercer lugar','Final'];
  const LABELS={A:'Grupo A',B:'Grupo B',C:'Grupo C',D:'Grupo D',E:'Grupo E',F:'Grupo F',G:'Grupo G',H:'Grupo H',I:'Grupo I',J:'Grupo J',K:'Grupo K',L:'Grupo L','16avos':'Dieciseisavos','Cuartos':'Cuartos de Final','Semis':'Semifinales','Tercer lugar':'Tercer Lugar','Final':'Gran Final'};
  let html='';
  GRUPOS.forEach(g=>{
    const ps=PARTIDOS.filter(p=>p.g===g);
    if(!ps.length) return;
    html+=`<div class="fase-label">${LABELS[g]}</div>`;
    ps.forEach(p=>{
      const pred=picks[p.id]||{};
      const res=allData.resultados[p.id];
      const pts=calcPts(pred,res);
      const badge=pts!==null?`<span class="pbadge p${pts}">${pts===3?'3pts ✓':pts===1?'1pt ~':'0pts ✗'}</span>`:'';
      html+=`<div class="pcard${p.mx?' mx':''}">
        <div class="pmeta"><span>${p.g!=='A'&&p.g!=='B'&&p.g!=='C'&&p.g!=='D'&&p.g!=='E'&&p.g!=='F'&&p.g!=='G'&&p.g!=='H'&&p.g!=='I'&&p.g!=='J'&&p.g!=='K'&&p.g!=='L'?'':'Grupo '+p.g+' · '}${p.fecha}</span><span>${p.sede}</span></div>
        <div class="pteams">
          <span class="pteam">${p.mx&&p.local==='México'?'🇲🇽 ':''}${p.local}</span>
          <span class="pvs">vs</span>
          <span class="pteam r">${p.mx&&p.visit==='México'?'🇲🇽 ':''}${p.visit}</span>
        </div>
        <div class="pinputs">
          <div style="flex:1;display:flex;justify-content:flex-start">
            <input type="number" class="sinput" id="l_${p.id}" min="0" max="20" value="${pred.predLocal??''}" placeholder="0"${res?' disabled':''}>
          </div>
          <span class="ssep">—</span>
          <div style="flex:1;display:flex;justify-content:flex-end">
            <input type="number" class="sinput" id="v_${p.id}" min="0" max="20" value="${pred.predVisitante??''}" placeholder="0"${res?' disabled':''}>
          </div>
          ${badge}
        </div>
        ${res?`<div class="presult">Resultado: ${res.local} - ${res.visitante}</div>`:''}
      </div>`;
    });
  });

  // Campeón
  const predC=localStorage.getItem('pred_c_'+familia)||'';
  html+=`<div class="fase-label">Campeón del Mundial (+5 pts)</div>
  <div class="pcard">
    <p style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:.75rem">¿Quién va a ganar el Mundial 2026?</p>
    <select id="sel_c" style="margin-bottom:0">
      <option value="">Elige un equipo...</option>
      ${CAMPEON_OPS.map(c=>`<option value="${c}"${predC===c?' selected':''}>${c}</option>`).join('')}
    </select>
  </div>`;
  document.getElementById('picksContent').innerHTML=html;
}

async function guardarTodo(){
  const btn=document.getElementById('saveBtn');
  btn.textContent='Guardando...';btn.disabled=true;
  const promises=PARTIDOS.map(p=>{
    const lEl=document.getElementById('l_'+p.id);
    const vEl=document.getElementById('v_'+p.id);
    if(!lEl||lEl.disabled) return null;
    const l=lEl.value,v=vEl.value;
    if(l===''&&v==='') return null;
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'savePick',familia,partidoId:p.id,local:l,visitante:v})}).catch(()=>null);
  }).filter(Boolean);
  const sel=document.getElementById('sel_c');
  if(sel&&sel.value) localStorage.setItem('pred_c_'+familia,sel.value);
  await Promise.all(promises);
  await cargarDatos();
  renderPicks();
  btn.textContent='Guardar pronósticos';btn.disabled=false;
  showToast('¡Pronósticos guardados! 🎉');
}

// ── TABLA ─────────────────────────────────────────────────────
function renderTabla(){
  const fams=Object.entries(allData.familias||{}).map(([n,d])=>({n,pts:d.puntos||0})).sort((a,b)=>b.pts-a.pts);
  if(!fams.length){document.getElementById('tablaContent').innerHTML='<p style="text-align:center;color:rgba(255,255,255,.3);padding:2rem">Aún no hay pronósticos</p>';return;}
  const medals=['🥇','🥈','🥉'];
  let html='<div class="tabla-card">';
  fams.forEach((f,i)=>{
    const mine=f.n===familia;
    html+=`<div class="trow"${mine?' style="background:rgba(200,169,81,.08)"':''}>
      <span class="tpos${i===0?' g':''}">${medals[i]||i+1}</span>
      <span class="tname">${f.n}${mine?' <span style="font-size:10px;color:#C8A951">(tú)</span>':''}</span>
      <span class="tpts">${f.pts}</span>
      <span style="font-size:11px;color:rgba(255,255,255,.3)">pts</span>
    </div>`;
  });
  html+='</div>';
  document.getElementById('tablaContent').innerHTML=html;
}

// ── RESULTADOS ────────────────────────────────────────────────
function renderResultados(){
  const GRUPOS=['A','B','C','D','E','F','G','H','I','J','K','L','16avos','Cuartos','Semis','Tercer lugar','Final'];
  const LABELS={A:'Grupo A',B:'Grupo B',C:'Grupo C',D:'Grupo D',E:'Grupo E',F:'Grupo F',G:'Grupo G',H:'Grupo H',I:'Grupo I',J:'Grupo J',K:'Grupo K',L:'Grupo L','16avos':'Dieciseisavos','Cuartos':'Cuartos de Final','Semis':'Semifinales','Tercer lugar':'Tercer Lugar','Final':'Gran Final'};
  let html='';
  GRUPOS.forEach(g=>{
    const ps=PARTIDOS.filter(p=>p.g===g);
    if(!ps.length) return;
    html+=`<div class="fase-label">${LABELS[g]}</div>`;
    ps.forEach(p=>{
      const res=allData.resultados[p.id]||{};
      html+=`<div class="pcard${p.mx?' mx':''}">
        <div class="pmeta"><span>${p.fecha}</span><span>${p.sede}</span></div>
        <div class="pteams"><span class="pteam">${p.local}</span><span class="pvs">vs</span><span class="pteam r">${p.visit}</span></div>
        <div class="pinputs">
          <input type="number" class="sinput" id="rl_${p.id}" min="0" max="20" value="${res.local??''}" placeholder="0">
          <span class="ssep">—</span>
          <input type="number" class="sinput" id="rv_${p.id}" min="0" max="20" value="${res.visitante??''}" placeholder="0">
          <button onclick="saveRes('${p.id}')" style="margin-left:6px;background:#333;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit">Guardar</button>
        </div>
      </div>`;
    });
  });
  document.getElementById('resultadosContent').innerHTML=html;
}

async function saveRes(id){
  const l=document.getElementById('rl_'+id).value;
  const v=document.getElementById('rv_'+id).value;
  if(l===''||v==='') return;
  await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveResult',partidoId:id,local:l,visitante:v})}).catch(()=>null);
  await cargarDatos();
  renderPicks();renderTabla();renderResultados();
  showToast('Resultado guardado ✓');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
